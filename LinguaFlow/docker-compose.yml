version: '3.8'

services:
  linguaflow:
    build: .
    container_name: linguaflow_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - DB_PATH=/app/data/linguaflow.db
      - UPLOAD_DIR=/app/uploads
    volumes:
      - linguaflow_data:/app/data
      - linguaflow_uploads:/app/uploads

volumes:
  linguaflow_data:
  linguaflow_uploads:
